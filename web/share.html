<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>小桔云盘 · 分享</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='12' fill='%23f59e0b'/%3E%3Cpath d='M16 5c2-3 6-3 7-1-3 0-5 1-7 1z' fill='%2316a34a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=10">
  <script src="config.js?v=10"></script>
  <script src="share.js?v=10" defer></script>
</head>
<body class="share-page">
  <header class="topbar">
    <span class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="17.5" r="11.5" fill="#f59e0b"/><path d="M16 6c1.6-2.6 5.4-3.2 7.2-1.4-2.8.2-5 .9-7.2 1.4z" fill="#22c55e"/><circle cx="12" cy="14" r="2.2" fill="#fff" opacity=".35"/></svg>
      <span>小桔云盘</span>
    </span>
    <span class="share-tag">分享</span>
  </header>

  <main class="share-main">
    <nav id="sh-crumbs" class="crumbs" hidden></nav>
    <div class="album-head">
      <h1 id="sh-title">正在打开…</h1>
      <p id="sh-meta" class="stats"></p>
    </div>

    <form id="sh-pass" class="sh-pass" hidden>
      <p class="hint">这个分享设了密码</p>
      <input id="sh-password" type="password" autocomplete="off" placeholder="输入密码" required>
      <p id="sh-pass-error" class="error" hidden></p>
      <button type="submit" class="primary">打开</button>
    </form>

    <p id="sh-msg" class="sh-msg" hidden></p>
    <div id="sh-albums" class="albums" hidden></div>
    <div id="sh-grid" class="grid" hidden></div>
    <ul id="sh-files" class="trash-list" hidden></ul>
  </main>

  <!-- 看大图、播放视频：左右滑动或点两边换下一个 -->
  <dialog id="sh-viewer" class="sh-viewer" aria-label="查看">
    <div class="sh-bar">
      <button id="sh-close" type="button" class="vw-btn" aria-label="关闭"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
      <div class="vw-title"><b id="sh-vname"></b><small id="sh-vcount"></small></div>
      <a id="sh-download" class="vw-btn" aria-label="下载" download><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v10M5.5 8.5L10 13l4.5-4.5M4 16.5h12"/></svg></a>
    </div>
    <div id="sh-stage" class="sh-stage"></div>
    <button id="sh-prev" type="button" class="sh-nav prev" aria-label="上一个"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4L6.5 10l6 6"/></svg></button>
    <button id="sh-next" type="button" class="sh-nav next" aria-label="下一个"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4l6 6-6 6"/></svg></button>
  </dialog>
</body>
</html>
