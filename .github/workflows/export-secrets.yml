# 把部署用的 Secrets 和 Variables 加密导出，给家里的 Windows 电脑用（见 deploy/windows/README.md）。
# 只能手动触发（要有仓库写权限）。用电脑上 install.ps1 生成的 age 公钥加密，只有那台电脑的私钥能解开；
# 明文不进日志、不进产物。产物 1 天后自动删除。
name: Export secrets for home server

on:
  workflow_dispatch:
    inputs:
      age_public_key:
        description: "家里电脑的 age 公钥（C:\\xiaoju\\age-public-key.txt 里那一行，age1 开头）"
        required: true

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt
        env:
          RECIPIENT: ${{ inputs.age_public_key }}
          XIAOJU_ADMIN_TOKEN: ${{ secrets.XIAOJU_ADMIN_TOKEN }}
          XIAOJU_MASTER_KEY: ${{ secrets.XIAOJU_MASTER_KEY }}
          TG_APP_ID: ${{ secrets.TG_APP_ID }}
          TG_APP_HASH: ${{ secrets.TG_APP_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          TG_BACKUP_BOT_TOKEN: ${{ secrets.TG_BACKUP_BOT_TOKEN }}
          TG_BACKUP_CHANNEL_ID: ${{ secrets.TG_BACKUP_CHANNEL_ID }}
          TG_EXTRA_BOT_TOKENS: ${{ secrets.TG_EXTRA_BOT_TOKENS }}
          TG_BACKUP_EXTRA_BOT_TOKENS: ${{ secrets.TG_BACKUP_EXTRA_BOT_TOKENS }}
          TG_AGENT_BOT_TOKENS: ${{ secrets.TG_AGENT_BOT_TOKENS }}
          TG_NOTIFY_CHAT_ID: ${{ secrets.TG_NOTIFY_CHAT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TG_TRANSPORT: ${{ vars.TG_TRANSPORT }}
          TG_AGENT_BOTS: ${{ vars.TG_AGENT_BOTS }}
          XIAOJU_PART_SIZE: ${{ vars.XIAOJU_PART_SIZE }}
          XIAOJU_CORS_ORIGINS: ${{ vars.XIAOJU_CORS_ORIGINS }}
          XIAOJU_WEBAUTHN_RP_ID: ${{ vars.XIAOJU_WEBAUTHN_RP_ID }}
          XIAOJU_WEBAUTHN_ORIGINS: ${{ vars.XIAOJU_WEBAUTHN_ORIGINS }}
          XIAOJU_TIMEZONE: ${{ vars.XIAOJU_TIMEZONE }}
          XIAOJU_PUBLIC_URL: ${{ vars.XIAOJU_PUBLIC_URL }}
        run: |
          set -euo pipefail
          if ! [[ "$RECIPIENT" =~ ^age1[0-9a-z]{58}$ ]]; then
            echo "公钥格式不对：应该是 age1 开头的一行（62 个字符）。" >&2
            exit 1
          fi
          if [ -z "$XIAOJU_MASTER_KEY" ]; then
            echo "仓库 Secrets 里没有 XIAOJU_MASTER_KEY，导出了也解不开备份。" >&2
            exit 1
          fi
          sudo apt-get install -y -qq age >/dev/null
          # XIAOJU_DATABASE_URL（Neon）故意不导出：家里用本机的库
          python3 - <<'EOF' | age -r "$RECIPIENT" -o secrets.env.age
          import os
          keys = """XIAOJU_ADMIN_TOKEN XIAOJU_MASTER_KEY TG_APP_ID TG_APP_HASH TG_BOT_TOKEN TG_CHANNEL_ID
          TG_BACKUP_BOT_TOKEN TG_BACKUP_CHANNEL_ID TG_EXTRA_BOT_TOKENS TG_BACKUP_EXTRA_BOT_TOKENS TG_AGENT_BOT_TOKENS
          TG_NOTIFY_CHAT_ID GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET TG_TRANSPORT TG_AGENT_BOTS XIAOJU_PART_SIZE
          XIAOJU_CORS_ORIGINS XIAOJU_WEBAUTHN_RP_ID XIAOJU_WEBAUTHN_ORIGINS XIAOJU_TIMEZONE XIAOJU_PUBLIC_URL""".split()
          for k in keys:
              v = os.environ.get(k, "").strip()
              if not v:
                  continue
              # 环境变量文件一行一项；令牌列表本来就可以用逗号分隔
              v = ",".join(x.strip() for x in v.splitlines() if x.strip())
              print(f"{k}={v}")
          EOF
          echo "导出了这些（只有名字）："
          python3 -c "import os; print(' '.join(k for k in os.environ if (k.startswith('XIAOJU_') or k.startswith('TG_') or k.startswith('GOOGLE_')) and os.environ[k].strip()))"
      - uses: actions/upload-artifact@v4
        with:
          name: secrets
          path: secrets.env.age
          retention-days: 1
