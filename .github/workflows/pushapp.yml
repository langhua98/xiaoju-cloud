name: Build 小橘推送 app

# 小橘推送（pushapp/）：在 GitHub 的 Mac 机器上用 XcodeGen 生成工程再编译，
# 没签名的 .ipa 发布到 Release「pushapp」（每次覆盖），用 SideStore / 自己的证书签名安装。
on:
  workflow_dispatch:
  push:
    paths:
      - "pushapp/**"
      - ".github/workflows/pushapp.yml"

permissions:
  contents: write

concurrency:
  group: pushapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Pick the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build
        working-directory: pushapp
        run: |
          xcodegen generate
          xcodebuild -project XiaojuPush.xcodeproj -scheme XiaojuPush -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
          app=build/Build/Products/Release-iphoneos/XiaojuPush.app
          mkdir Payload && cp -R "$app" Payload/
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          ipa="XiaojuPush-$version-build$GITHUB_RUN_NUMBER.ipa"
          zip -qry "../$ipa" Payload
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IPA=$ipa" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA }}
          path: ${{ env.IPA }}
      - name: Publish to the pushapp release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pushapp --yes --cleanup-tag || true
          gh release create pushapp "$IPA" --prerelease --target "$GITHUB_SHA" \
            --title "小橘推送 ${VERSION}（构建 ${GITHUB_RUN_NUMBER}）" \
            --notes "没签名的测试版（${GITHUB_REF_NAME} ${GITHUB_SHA::7}），需要用 SideStore 或自己的证书签名后安装。见 pushapp/README.md。"
