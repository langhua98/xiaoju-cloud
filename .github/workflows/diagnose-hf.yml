name: Diagnose Hugging Face Space

# 手动运行：查询线上服务的备份状态和网盘统计，并打印 Space 最近的运行日志（只输出备份、批量上传、警告和错误相关的行）。
# reconcile=report 时附带对账报告（只读）；=apply 时执行对账修复和残块清理（见 README“对账与清理残块”）。
on:
  workflow_dispatch:
    inputs:
      reconcile:
        description: "对账：none 不做；report 只出报告；apply 修复并清理残块"
        type: choice
        options: [report, none, apply]
        default: report

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query service and logs
        env:
          RECONCILE: ${{ inputs.reconcile }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          XIAOJU_ADMIN_TOKEN: ${{ secrets.XIAOJU_ADMIN_TOKEN }}
        run: |
          # Secrets 里可能带有换行符，去掉
          clean() { printf %s "$1" | tr -d '\r\n'; }
          SPACE=$(clean "$HF_SPACE_ID")
          TOKEN=$(clean "$XIAOJU_ADMIN_TOKEN")
          HF=$(clean "$HF_TOKEN")
          HOST="https://$(echo "$SPACE" | tr '/_.' '---' | tr 'A-Z' 'a-z').hf.space"
          echo "space: $SPACE ($HOST)"

          api() {
            curl -sS --retry 3 --retry-delay 10 --max-time 300 -H "X-Xiaoju-Token: $TOKEN" "$@"
            echo
          }
          echo "::group::backup status"
          api "$HOST/api/backup/status"
          echo "::endgroup::"
          echo "::group::drive stats"
          api "$HOST/api/stats"
          echo "::endgroup::"

          pretty() { out=$(cat); printf '%s\n' "$out" | python3 -m json.tool 2>/dev/null || printf '%s\n' "$out"; }
          case "$RECONCILE" in
            report) echo "::group::reconcile report (read-only)"
                    api "$HOST/api/maintenance/reconcile" | pretty
                    echo "::endgroup::" ;;
            apply)  echo "::group::reconcile APPLY"
                    api -X POST "$HOST/api/maintenance/reconcile" | pretty
                    echo "::endgroup::" ;;
          esac

          echo "::group::space run logs (backup / ingest / thumbnail / warnings / errors, last 200)"
          curl -sS -N --max-time 30 -H "Authorization: Bearer $HF" \
            "https://huggingface.co/api/spaces/$SPACE/logs/run" 2>/dev/null \
            | sed -n 's/^data: //p' \
            | python3 -c 'import sys, json
          for line in sys.stdin:
              try: print(json.loads(line).get("data", "").rstrip())
              except ValueError: print(line.rstrip())' \
            | grep -E "backup|WARN|ERROR|Startup|listening|ingest|thumbnail" | tail -200 || true
          echo "::endgroup::"
