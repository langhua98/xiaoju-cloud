name: Build iPhone app

# 小桔备份（ios/）：在 GitHub 的 Mac 机器上用 XcodeGen 生成工程再编译。
# - build：没签名的 .ipa，发布到 Release「ios-test」（每次覆盖），可以自己签名安装；
# - testflight：仓库里配好 App Store Connect 的 API 密钥（Secrets：ASC_KEY_ID、ASC_ISSUER_ID、ASC_KEY_P8、
#   APPLE_TEAM_ID）后，自动签名、上传 TestFlight，手机上在 TestFlight 里安装。见 ios/README.md。
# 只手动运行（Actions → Build iPhone app → Run workflow）：Mac 机器的分钟数贵，App 也还要先解决签名才能装。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  XIAOJU_API_URL: ${{ vars.XIAOJU_API_URL }}

jobs:
  build:
    # 后台上传接口要 iOS 26.4 的 SDK，macos-15 上的 Xcode 太旧编不过
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Pick the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project XiaojuBackup.xcodeproj -scheme XiaojuBackup -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            ${XIAOJU_API_URL:+XIAOJU_API_URL="$XIAOJU_API_URL"} \
            build
          app=build/Build/Products/Release-iphoneos/XiaojuBackup.app
          find "$app" -maxdepth 3 -name '*.appex' -print
          mkdir Payload && cp -R "$app" Payload/
          # 版本号：project.yml 的 MARKETING_VERSION + 构建号（工作流的运行次数，每次加一），写进文件名，装之前分得清
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          ipa="XiaojuBackup-$version-build$GITHUB_RUN_NUMBER.ipa"
          zip -qry "../$ipa" Payload
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IPA=$ipa" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA }}
          path: ${{ env.IPA }}
      - name: Publish to the ios-test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-test --yes --cleanup-tag || true
          changes=$(git log -1 --format=%s "$GITHUB_SHA")
          gh release create ios-test "$IPA" --prerelease --target "$GITHUB_SHA" \
            --title "小桔备份 ${VERSION}（构建 ${GITHUB_RUN_NUMBER}）" \
            --notes "版本 ${VERSION}，构建 ${GITHUB_RUN_NUMBER}（${GITHUB_REF_NAME} ${GITHUB_SHA::7}）。App 里「我的」最下面能看到装的是哪个构建。

          这次的改动：${changes}

          没签名的测试版，需要自己签名后安装；配好 TestFlight 后用 TestFlight 装更省事。见 ios/README.md。"

  # 没配 App Store Connect 密钥时跳过 TestFlight
  keys:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "App Store Connect secrets not set; skipping TestFlight"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  testflight:
    needs: [build, keys]
    if: needs.keys.outputs.ready == 'true'
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Archive and upload to TestFlight
        working-directory: ios
        run: |
          xcodegen generate
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # 每次上传的编号要比上次大：用工作流的运行次数
          xcodebuild -project XiaojuBackup.xcodeproj -scheme XiaojuBackup -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/XiaojuBackup.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            ${XIAOJU_API_URL:+XIAOJU_API_URL="$XIAOJU_API_URL"} \
            "${auth[@]}" archive
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/XiaojuBackup.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export "${auth[@]}"
