name: Diagnose Hugging Face Space

# 手动运行：查询线上服务的备份状态和网盘统计，并打印 Space 最近的运行日志（只输出备份、批量上传、警告和错误相关的行）。
# reconcile=report 时附带对账报告（只读）；=apply 时执行对账修复和残块清理（见 README“对账与清理残块”）。
on:
  workflow_dispatch:
    inputs:
      reconcile:
        description: "对账：none 不做；report 只出报告；apply 修复并清理残块"
        type: choice
        options: [report, none, apply]
        default: report
      grep:
        description: "另外打印日志里含这个文字的所有行（比如文件名），不填不打印"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query service and logs
        env:
          RECONCILE: ${{ inputs.reconcile }}
          GREP: ${{ inputs.grep }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          XIAOJU_ADMIN_TOKEN: ${{ secrets.XIAOJU_ADMIN_TOKEN }}
        run: |
          # Secrets 里可能带有换行符，去掉
          clean() { printf %s "$1" | tr -d '\r\n'; }
          SPACE=$(clean "$HF_SPACE_ID")
          TOKEN=$(clean "$XIAOJU_ADMIN_TOKEN")
          HF=$(clean "$HF_TOKEN")
          HOST="https://$(echo "$SPACE" | tr '/_.' '---' | tr 'A-Z' 'a-z').hf.space"
          echo "space: $SPACE ($HOST)"

          api() {
            curl -sS --retry 3 --retry-delay 10 --max-time 300 -H "X-Xiaoju-Token: $TOKEN" "$@"
            echo
          }
          echo "::group::backup status"
          api "$HOST/api/backup/status"
          echo "::endgroup::"
          echo "::group::drive stats"
          api "$HOST/api/stats"
          echo "::endgroup::"
          echo "::group::upload activity (active: uploads in progress right now)"
          api "$HOST/api/maintenance/activity"
          echo "::endgroup::"

          pretty() { out=$(cat); printf '%s\n' "$out" | python3 -m json.tool 2>/dev/null || printf '%s\n' "$out"; }
          case "$RECONCILE" in
            report) echo "::group::reconcile report (read-only)"
                    api "$HOST/api/maintenance/reconcile" | pretty
                    echo "::endgroup::" ;;
            apply)  echo "::group::reconcile APPLY"
                    api -X POST "$HOST/api/maintenance/reconcile" | pretty
                    echo "::endgroup::" ;;
          esac

          # Telegram 的 flood wait 一次几百行，会把要看的上传日志挤掉：不逐行打印，只记个数
          curl -sS -N --max-time 30 -H "Authorization: Bearer $HF" \
            "https://huggingface.co/api/spaces/$SPACE/logs/run" 2>/dev/null \
            | sed -n 's/^data: //p' \
            | python3 -c 'import sys, json
          for line in sys.stdin:
              try: print(json.loads(line).get("data", "").rstrip())
              except ValueError: print(line.rstrip())' > run.log || true
          echo "::group::space run logs (backup / ingest / thumbnail / warnings / errors, last 300)"
          grep -E "backup|WARN|ERROR|Startup|listening|ingest|resumable|thumbnail|scrub|extra bot" run.log | grep -v "telegram flood wait" | tail -300 || true
          echo "::endgroup::"
          echo "::group::iPhone app background extension (heartbeat / preflight / non-app agents)"
          grep -E "heartbeat|preflight" run.log | tail -50 || true
          grep "ingest receiving" run.log | grep -v "XiaojuBackup/1 CFNetwork" | tail -20 || true
          echo "::endgroup::"
          echo "::group::per minute: flood waits (method, longest wait) / files stored / big-file chunks"
          grep "telegram flood wait" run.log | tail -3 || true
          python3 - run.log <<'PY'
          import re, sys, collections
          flood = collections.defaultdict(collections.Counter); longest = {}; stored = collections.Counter(); chunks = collections.Counter()
          for line in open(sys.argv[1], errors="replace"):
              m = re.search(r"time=\S+T(\d\d:\d\d)", line)
              if not m: continue
              t = m.group(1)
              if "telegram flood wait" in line:
                  meth = re.search(r"method=(\S+)", line); w = re.search(r"wait=(\S+)", line)
                  rest = re.sub(r"^.*?give_up=\S+", "", line).strip()
                  flood[t][(meth.group(1) if meth else "?") + (" " + rest if rest else "")] += 1
                  if w: longest[t] = max(longest.get(t, ""), w.group(1), key=len)
              elif "msg=ingested" in line: stored[t] += 1
              elif "resumable upload received" in line: chunks[t] += 1
          for t in sorted(set(flood) | set(stored) | set(chunks)):
              print(t, "stored", stored[t], "chunks", chunks[t], "flood", dict(flood[t]), longest.get(t, ""))
          PY
          echo "::endgroup::"
          if [ -n "$GREP" ]; then
            echo "::group::log lines containing: $GREP"
            grep -F -- "$GREP" run.log | tail -200 || true
            echo "::endgroup::"
          fi
          echo "telegram flood waits in these logs: $(grep -c "telegram flood wait" run.log || true)" \
            "(last: $(grep "telegram flood wait" run.log | tail -1 | sed -n 's/^time=\([^ ]*\).*/\1/p'))"
