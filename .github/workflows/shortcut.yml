name: Build iPhone shortcut

# 改了快捷指令时在开发分支上编译 + 签名一次，签好的文件作为构建产物上传（检查签名服务是否可用）。
# main 上由 pages.yml 在部署网页时构建，这里不再重复（签名服务有频率限制）。
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - "shortcuts/**"
      - ".github/workflows/shortcut.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install Cherri
        run: go install github.com/electrikmilk/cherri@v1.3.2
      - name: Build and sign
        env:
          XIAOJU_API_URL: ${{ vars.XIAOJU_API_URL }}
        run: |
          for s in backup newphotos share; do
            python3 shortcuts/build.py --cherri "$(go env GOPATH)/bin/cherri" --shortcut "$s" --out "xiaoju-$s.shortcut" \
              ${XIAOJU_API_URL:+--api "$XIAOJU_API_URL"}
          done
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoju-shortcuts
          path: xiaoju-*.shortcut
