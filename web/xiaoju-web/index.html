<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>小桔</title>
<style>
  :root {
    --bg1: #fdf2f6;
    --bg2: #e9e6fb;
    --panel: rgba(255, 255, 255, 0.82);
    --text: #3a3550;
    --accent: #e98aa8;
    --accent2: #7b6fd6;
    --btn: #ffffff;
    --btn-border: #ebe3f2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: linear-gradient(180deg, var(--bg1), var(--bg2));
  }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; z-index: 10;
    background: linear-gradient(180deg, var(--bg1), var(--bg2));
    transition: opacity .5s;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  .bar { width: 220px; height: 8px; border-radius: 4px; background: #fff; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .2s; }
  #panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 18px 18px 0 0; box-shadow: 0 -4px 20px rgba(120, 100, 160, .12);
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .tabs button {
    flex: 1; border: 0; background: transparent; padding: 6px 0; font-size: 14px;
    color: #8c86a3; border-bottom: 2px solid transparent; font-family: inherit;
  }
  .tabs button.on { color: var(--accent2); border-color: var(--accent2); font-weight: 600; }
  .grid { display: none; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grid.on { display: grid; }
  .grid button {
    border: 1px solid var(--btn-border); background: var(--btn); border-radius: 12px;
    padding: 10px 0 8px; font-size: 13px; color: var(--text); font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .grid button span { font-size: 20px; line-height: 1.2; }
  .grid button:active { transform: scale(.94); background: #fbeef3; }
  .grid button.on { border-color: var(--accent); background: #fdeef3; }
  #tip {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 0; right: 0;
    text-align: center; font-size: 12px; color: #9a94b0; z-index: 4; pointer-events: none;
  }
  #err { color: #c0392b; font-size: 14px; max-width: 280px; text-align: center; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="tip">单指拖动旋转 · 双指缩放</div>

<div id="loading">
  <div style="font-size:18px">小桔正在赶来…</div>
  <div class="bar"><i id="prog"></i></div>
  <div id="pct" style="font-size:13px;color:#9a94b0">0%</div>
  <div id="err"></div>
</div>

<div id="panel">
  <div class="tabs">
    <button class="on" data-tab="act">动作</button>
    <button data-tab="face">表情</button>
    <button data-tab="view">视角</button>
  </div>
  <div class="grid on" id="tab-act">
    <button data-act="wave"><span>👋</span>挥手</button>
    <button data-act="nod"><span>🙂</span>点头</button>
    <button data-act="bow"><span>🙇</span>鞠躬</button>
    <button data-act="spin"><span>💫</span>转圈</button>
    <button data-act="jump"><span>⬆️</span>跳一跳</button>
    <button data-act="shake"><span>🙅</span>摇头</button>
    <button data-act="talk"><span>💬</span>说话</button>
    <button data-act="cheer"><span>🙌</span>欢呼</button>
  </div>
  <div class="grid" id="tab-face">
    <button data-face="neutral" class="on"><span>😐</span>默认</button>
    <button data-face="happy"><span>😊</span>开心</button>
    <button data-face="angry"><span>😠</span>生气</button>
    <button data-face="sad"><span>😢</span>难过</button>
    <button data-face="surprised"><span>😲</span>惊讶</button>
    <button data-face="relaxed"><span>😌</span>放松</button>
    <button data-face="shy"><span>😳</span>害羞</button>
    <button data-face="wink"><span>😉</span>眨眼</button>
  </div>
  <div class="grid" id="tab-view">
    <button data-view="full"><span>🧍</span>全身</button>
    <button data-view="half"><span>👤</span>半身</button>
    <button data-view="face"><span>🔍</span>脸部</button>
    <button data-view="auto"><span>🔄</span>自动转</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.0/lib/three-vrm.module.min.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const MODEL_URL = './xiaoju.vrm';

// ---------- 场景 ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 50);
camera.position.set(0, 1.2, 4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 0.5;
controls.maxDistance = 8;
controls.target.set(0, 0.9, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(1, 2, 2);
scene.add(sun);

// 地面圆形阴影
const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(0.45, 48),
  new THREE.MeshBasicMaterial({ color: 0x7b6fd6, transparent: true, opacity: 0.12 })
);
shadow.rotation.x = -Math.PI / 2;
scene.add(shadow);

// ---------- 加载模型 ----------
let vrm = null;
const loader = new GLTFLoader();
loader.register((parser) => new VRMLoaderPlugin(parser));
loader.load(
  MODEL_URL,
  (gltf) => {
    vrm = gltf.userData.vrm;
    VRMUtils.removeUnnecessaryVertices(gltf.scene);
    if (VRMUtils.combineSkeletons) VRMUtils.combineSkeletons(gltf.scene);
    else if (VRMUtils.removeUnnecessaryJoints) VRMUtils.removeUnnecessaryJoints(gltf.scene);
    VRMUtils.rotateVRM0(vrm); // 兼容旧版 VRM 0.x，1.0 模型不受影响
    vrm.scene.traverse((o) => { o.frustumCulled = false; });
    scene.add(vrm.scene);
    if (vrm.lookAt) vrm.lookAt.target = camera; // 眼睛看向镜头

    const head = vrm.humanoid.getNormalizedBoneNode('head');
    const hp = new THREE.Vector3();
    head.getWorldPosition(hp);
    headY = hp.y;
    setView('full', true);

    document.getElementById('loading').classList.add('hide');
  },
  (p) => {
    // 服务器压缩传输时 total 可能比实际小，用模型原始大小兜底并限制在 99% 以内
    const total = Math.max(p.total || 0, 18537888);
    const pct = Math.min(99, Math.round((p.loaded / total) * 100));
    document.getElementById('prog').style.width = pct + '%';
    document.getElementById('pct').textContent = pct + '%';
  },
  (e) => {
    console.error(e);
    document.getElementById('err').textContent = '模型加载失败，请确认 xiaoju.vrm 和网页放在同一个文件夹，并通过本地服务打开。';
  }
);

// ---------- 视角 ----------
let headY = 1.4;
let autoRotate = false;
const viewAnim = { from: null, to: null, t: 1 };
function setView(name, instant = false) {
  if (name === 'auto') {
    autoRotate = !autoRotate;
    controls.autoRotate = autoRotate;
    controls.autoRotateSpeed = 2;
    document.querySelector('[data-view="auto"]').classList.toggle('on', autoRotate);
    return;
  }
  const h = headY + 0.1; // 身高
  const presets = {
    full: { target: [0, h * 0.36, 0], dist: h * 3.2 },
    half: { target: [0, h * 0.68, 0], dist: h * 1.6 },
    face: { target: [0, headY - 0.06, 0], dist: 0.9 },
  };
  const p = presets[name];
  const dir = camera.position.clone().sub(controls.target).normalize();
  const target = new THREE.Vector3(...p.target);
  const pos = target.clone().add(dir.multiplyScalar(p.dist));
  if (instant) {
    controls.target.copy(target);
    camera.position.copy(pos);
    return;
  }
  viewAnim.from = { t: controls.target.clone(), p: camera.position.clone() };
  viewAnim.to = { t: target, p: pos };
  viewAnim.t = 0;
}

// ---------- 姿势工具 ----------
// 骨骼角度用欧拉角 [x, y, z]（弧度），基于标准化骨骼：T 字姿势为 0。
const BONES = ['hips', 'spine', 'chest', 'upperChest', 'neck', 'head',
  'leftUpperArm', 'leftLowerArm', 'leftHand', 'rightUpperArm', 'rightLowerArm', 'rightHand',
  'leftUpperLeg', 'leftLowerLeg', 'rightUpperLeg', 'rightLowerLeg'];

const ease = (x) => x * x * (3 - 2 * x);
const clamp01 = (x) => Math.min(1, Math.max(0, x));
// 动作开始和结束时平滑过渡
const envelope = (t, dur, fade = 0.35) => Math.min(ease(clamp01(t / fade)), ease(clamp01((dur - t) / fade)));

function idlePose(time) {
  const b = Math.sin(time * 1.6); // 呼吸
  const s = Math.sin(time * 0.7); // 轻微摇摆
  return {
    hips: [0, s * 0.03, 0],
    spine: [b * 0.015, 0, s * 0.01],
    chest: [b * 0.02, 0, 0],
    neck: [0, 0, 0],
    head: [0.03, s * 0.05, -s * 0.02],
    leftUpperArm: [0, 0, -1.2 + b * 0.02],
    rightUpperArm: [0, 0, 1.2 - b * 0.02],
    leftLowerArm: [0, -0.15, 0],
    rightLowerArm: [0, 0.15, 0],
    pos: [0, 0, 0],
    rotY: 0,
  };
}

// 每个动作：时长 + 根据时间 t 返回要叠加/覆盖的骨骼角度
const ACTIONS = {
  wave: {
    dur: 2.8, face: 'happy',
    pose: (t) => ({
      rightUpperArm: [0, -0.2, -0.15],
      rightLowerArm: [0, 0, -1.4 + Math.sin(t * 11) * 0.35],
      rightHand: [0, 0, -0.2],
      head: [0.05, -0.12, 0.08],
    }),
  },
  nod: {
    dur: 1.8, face: 'happy',
    pose: (t) => ({ head: [Math.abs(Math.sin(t * 5.2)) * 0.32, 0, 0], neck: [Math.abs(Math.sin(t * 5.2)) * 0.1, 0, 0] }),
  },
  shake: {
    dur: 1.8, face: 'sad',
    pose: (t) => ({ head: [0.05, Math.sin(t * 9) * 0.35, 0] }),
  },
  bow: {
    dur: 2.6, face: 'relaxed',
    pose: (t) => {
      const k = Math.sin(clamp01(t / 2.6) * Math.PI);
      return {
        spine: [0.45 * k, 0, 0], chest: [0.2 * k, 0, 0], head: [0.25 * k, 0, 0],
        leftUpperArm: [0, 0.25 * k, -1.3], rightUpperArm: [0, -0.25 * k, 1.3],
        leftLowerArm: [0, -0.6 * k, 0], rightLowerArm: [0, 0.6 * k, 0],
      };
    },
  },
  spin: {
    dur: 1.6, face: 'happy', noFade: ['rotY'],
    pose: (t) => ({
      rotY: ease(clamp01(t / 1.6)) * Math.PI * 2,
      leftUpperArm: [0, 0, -0.7], rightUpperArm: [0, 0, 0.7],
    }),
  },
  jump: {
    dur: 1.6, face: 'surprised',
    pose: (t) => {
      const ph = (t % 0.8) / 0.8;
      const up = Math.max(0, Math.sin(ph * Math.PI)) * 0.18;
      return {
        pos: [0, up, 0],
        leftUpperArm: [0, 0, -0.9 + up * 2], rightUpperArm: [0, 0, 0.9 - up * 2],
        leftUpperLeg: [-up * 1.5, 0, 0], rightUpperLeg: [-up * 1.5, 0, 0],
        leftLowerLeg: [up * 3, 0, 0], rightLowerLeg: [up * 3, 0, 0],
      };
    },
  },
  cheer: {
    dur: 2.4, face: 'happy',
    pose: (t) => {
      const w = Math.sin(t * 10) * 0.15;
      return {
        leftUpperArm: [0, 0, 0.9 + w], rightUpperArm: [0, 0, -0.9 - w],
        leftLowerArm: [0, 0, 0.3], rightLowerArm: [0, 0, -0.3],
        head: [-0.1, 0, 0], spine: [-0.05, 0, 0],
      };
    },
  },
  talk: {
    dur: 3.2, face: 'happy',
    pose: (t) => ({
      head: [0.03 + Math.sin(t * 3) * 0.04, Math.sin(t * 1.7) * 0.08, Math.sin(t * 2.3) * 0.04],
      rightUpperArm: [0, -0.3, 1.0], rightLowerArm: [0, 0.9 + Math.sin(t * 4) * 0.15, 0],
    }),
    mouth: true,
  },
};

let current = null; // { name, t }
function play(name) {
  if (!ACTIONS[name]) return;
  current = { name, t: 0 };
  const f = ACTIONS[name].face;
  if (f && faceSel === 'neutral') actionFace = f;
}

// ---------- 表情 ----------
const FACES = ['happy', 'angry', 'sad', 'surprised', 'relaxed'];
let faceSel = 'neutral';
let actionFace = null;
const faceW = Object.fromEntries([...FACES, 'blink', 'blinkLeft', 'aa', 'oh', 'ih'].map((k) => [k, 0]));
let blinkTimer = 2, blinkT = -1;
let shyBlush = null;

function setFace(name) {
  faceSel = name;
  document.querySelectorAll('[data-face]').forEach((b) => b.classList.toggle('on', b.dataset.face === name));
  if (name === 'wink') {
    winkT = 0;
  }
  if (name === 'shy') play('shyPose');
}
let winkT = -1;
ACTIONS.shyPose = {
  dur: 2.5,
  pose: () => ({ head: [0.25, -0.25, 0.15], neck: [0.1, 0, 0], leftUpperArm: [0, 0.5, -1.25], rightUpperArm: [0, -0.5, 1.25],
    leftLowerArm: [0, -1.2, 0], rightLowerArm: [0, 1.2, 0] }),
};

function updateFace(dt, time) {
  const em = vrm.expressionManager;
  if (!em) return;
  const sel = faceSel === 'shy' ? 'relaxed' : faceSel === 'wink' ? 'happy' : faceSel;
  const want = current && actionFace && faceSel === 'neutral' ? actionFace : sel;
  for (const k of FACES) {
    const target = k === want ? 1 : 0;
    faceW[k] += (target - faceW[k]) * Math.min(1, dt * 8);
  }
  // 自动眨眼（开心、放松时眼睛本来就眯着，不再叠加）
  blinkTimer -= dt;
  if (blinkTimer <= 0 && blinkT < 0) { blinkT = 0; blinkTimer = 2 + Math.random() * 3; }
  let blink = 0;
  if (blinkT >= 0) {
    blinkT += dt;
    blink = Math.sin(clamp01(blinkT / 0.16) * Math.PI);
    if (blinkT > 0.16) blinkT = -1;
  }
  const eyesBusy = faceW.happy + faceW.relaxed;
  faceW.blink = blink * Math.max(0, 1 - eyesBusy);
  // 眨一只眼
  let wink = 0;
  if (winkT >= 0) {
    winkT += dt;
    wink = Math.sin(clamp01(winkT / 0.6) * Math.PI);
    if (winkT > 0.6) { winkT = -1; setFace('neutral'); }
  }
  // 说话口型
  let aa = 0, oh = 0, ih = 0;
  if (current && ACTIONS[current.name].mouth) {
    const e = envelope(current.t, ACTIONS[current.name].dur, 0.2);
    aa = Math.max(0, Math.sin(time * 14)) * 0.7 * e;
    oh = Math.max(0, Math.sin(time * 9 + 1)) * 0.4 * e;
    ih = Math.max(0, Math.sin(time * 11 + 2)) * 0.3 * e;
  }
  for (const k of FACES) em.setValue(k, faceW[k]);
  em.setValue('blink', faceW.blink);
  em.setValue('blinkLeft', wink);
  em.setValue('aa', aa);
  em.setValue('oh', oh);
  em.setValue('ih', ih);
}

// ---------- 每帧更新 ----------
const clock = new THREE.Clock();
function applyPose(time, dt) {
  const base = idlePose(time);
  let pose = base, w = 0, extra = {};
  if (current) {
    const a = ACTIONS[current.name];
    current.t += dt;
    if (current.t >= a.dur) {
      current = null;
      actionFace = null;
    } else {
      w = envelope(current.t, a.dur);
      extra = a.pose(current.t);
      extra._noFade = a.noFade || [];
    }
  }
  const h = vrm.humanoid;
  for (const name of BONES) {
    const node = h.getNormalizedBoneNode(name);
    if (!node) continue;
    const b = base[name] || [0, 0, 0];
    const e = extra[name];
    const r = e ? b.map((v, i) => v + (e[i] - v) * w) : b;
    node.rotation.set(r[0], r[1], r[2]);
  }
  const bp = base.pos, ep = extra.pos || bp;
  vrm.scene.position.set(0, bp[1] + (ep[1] - bp[1]) * w, 0);
  const rotW = extra._noFade && extra._noFade.includes('rotY') ? 1 : w;
  vrm.scene.rotation.y = extra.rotY !== undefined ? extra.rotY * rotW : 0;
  shadow.scale.setScalar(1 - vrm.scene.position.y * 2);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  if (viewAnim.t < 1) {
    viewAnim.t = Math.min(1, viewAnim.t + dt * 2.5);
    const k = ease(viewAnim.t);
    controls.target.lerpVectors(viewAnim.from.t, viewAnim.to.t, k);
    camera.position.lerpVectors(viewAnim.from.p, viewAnim.to.p, k);
  }
  controls.update();

  if (vrm) {
    applyPose(time, dt);
    updateFace(dt, time);
    vrm.update(dt); // 更新头发裙子物理、表情、视线
  }
  renderer.render(scene, camera);
}
animate();

// ---------- 按钮 ----------
document.querySelectorAll('.tabs button').forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b === btn));
    document.querySelectorAll('.grid').forEach((g) => g.classList.toggle('on', g.id === 'tab-' + btn.dataset.tab));
  };
});
document.querySelectorAll('[data-act]').forEach((b) => (b.onclick = () => play(b.dataset.act)));
document.querySelectorAll('[data-face]').forEach((b) => (b.onclick = () => setFace(b.dataset.face)));
document.querySelectorAll('[data-view]').forEach((b) => (b.onclick = () => setView(b.dataset.view)));

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- 给代码调用的接口 ----------
// 在浏览器控制台里可以直接写：xiaoju.play('wave')、xiaoju.face('happy')、xiaoju.turn(90)
window.xiaoju = {
  play,
  face: setFace,
  view: setView,
  turn: (deg) => { controls.autoRotate = false; const a = THREE.MathUtils.degToRad(deg);
    const off = camera.position.clone().sub(controls.target).applyAxisAngle(new THREE.Vector3(0, 1, 0), a);
    camera.position.copy(controls.target).add(off); },
  get vrm() { return vrm; },
  actions: Object.keys(ACTIONS).filter((k) => k !== 'shyPose'),
};
</script>
</body>
</html>
