name: Deploy web to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shortcuts/**"
      - ".github/workflows/pages.yml"

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write config.js
        # 仓库变量 XIAOJU_API_URL（如 https://user-xiaoju-cloud.hf.space）覆盖前端默认服务端地址
        if: ${{ vars.XIAOJU_API_URL != '' }}
        env:
          XIAOJU_API_URL: ${{ vars.XIAOJU_API_URL }}
        run: |
          printf 'window.XIAOJU_API_URL = %s;\n' "$(jq -Rn --arg v "$XIAOJU_API_URL" '$v')" > web/config.js
          cat web/config.js
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install Cherri
        continue-on-error: true
        run: go install github.com/electrikmilk/cherri@v1.3.2
      - name: Build iPhone shortcuts
        # 签名靠第三方服务（HubSign），失败时网页照常发布，只是安全设置里不显示对应的“安装”按钮（仍可手动搭建）。
        # 几个快捷指令各自出错互不影响
        continue-on-error: true
        env:
          XIAOJU_API_URL: ${{ vars.XIAOJU_API_URL }}
        run: |
          status=0
          live="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          for s in backup newphotos share charge; do
            python3 shortcuts/build.py --cherri "$(go env GOPATH)/bin/cherri" --shortcut "$s" --out "web/xiaoju-$s.shortcut" \
              ${XIAOJU_API_URL:+--api "$XIAOJU_API_URL"} && continue
            status=1
            # 签名失败：沿用网上现在那一份（旧版本），免得安装按钮消失
            if curl -fsSL "$live/xiaoju-$s.shortcut" -o "web/xiaoju-$s.shortcut"; then
              echo "::warning::$s shortcut not rebuilt (signing failed); kept the previously published one"
            else
              rm -f "web/xiaoju-$s.shortcut"
            fi
          done
          exit $status
      - name: Stamp version
        # 网页带上提交号：已经打开的旧页面发现版本变了会自动刷新或提示刷新（见 app.js checkWebVersion）；
        # 资源地址的 ?v= 也换成提交号，每次部署浏览器都会重新下载
        run: |
          v="${GITHUB_SHA::7}"
          printf '{"version":"%s"}\n' "$v" > web/version.json
          sed -i "s/^const WEB_VERSION = \"dev\";/const WEB_VERSION = \"$v\";/" web/app.js
          sed -i -E "s/\?v=[0-9a-z]+\"/?v=$v\"/g" web/index.html web/share.html
          grep -q "^const WEB_VERSION = \"$v\";" web/app.js
          grep -o '?v=[0-9a-z]*' web/index.html web/share.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
