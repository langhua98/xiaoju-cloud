<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小桔云盘</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='12' fill='%23f59e0b'/%3E%3Cpath d='M16 5c2-3 6-3 7-1-3 0-5 1-7 1z' fill='%2316a34a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">小桔云盘</a>
    <button id="settings-btn" class="ghost" type="button">设置</button>
  </header>

  <main id="app" hidden>
    <div class="toolbar">
      <nav id="crumbs" class="crumbs" aria-label="当前位置"></nav>
      <div class="actions">
        <button id="mkdir-btn" type="button">新建文件夹</button>
        <label class="button primary">
          上传文件
          <input id="file-input" type="file" multiple hidden>
        </label>
      </div>
    </div>

    <section id="uploads" class="uploads" hidden></section>

    <div id="drop" class="listing">
      <table>
        <thead>
          <tr><th>名称</th><th class="size">大小</th><th class="date">修改时间</th><th class="ops"></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="empty" hidden>这里还没有文件，点“上传文件”或把文件拖到这里。</p>
      <p id="loading" class="empty">加载中…</p>
    </div>
  </main>

  <dialog id="settings">
    <form method="dialog" id="settings-form">
      <h2>连接服务端</h2>
      <label>服务端地址
        <input name="api" type="url" required placeholder="https://xxx-xiaoju-cloud.hf.space">
      </label>
      <label>访问令牌（XIAOJU_ADMIN_TOKEN）
        <input name="token" type="password" required autocomplete="current-password">
      </label>
      <p class="hint">令牌只保存在本浏览器里。</p>
      <p id="settings-error" class="error" hidden></p>
      <div class="dialog-actions">
        <button value="cancel" formnovalidate type="submit" class="ghost">取消</button>
        <button value="save" type="submit" class="primary">连接</button>
      </div>
    </form>
  </dialog>

  <dialog id="preview" class="preview">
    <div class="preview-head">
      <span id="preview-title"></span>
      <button id="preview-close" type="button" class="ghost">关闭</button>
    </div>
    <div id="preview-body" class="preview-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
