name: Check server image

# 构建 Hugging Face 用的镜像，在镜像里实际生成照片（含 iPhone 的 HEIC）和视频的缩略图，
# 确认 vips、ffmpeg 装对了。开发分支改了镜像或缩略图代码时运行；deploy-hf.yml 部署前也会调用。
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches-ignore: [main]
    paths:
      - "Dockerfile"
      - "deploy/huggingface/Dockerfile"
      - "internal/thumb/**"
      - ".github/workflows/image.yml"

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f deploy/huggingface/Dockerfile -t xiaoju-hf .
      - name: Make thumbnails inside the image
        run: |
          set -euo pipefail
          mkdir -p /tmp/t && cp internal/thumb/testdata/{sample,taken}.heic /tmp/t/ && chmod 777 /tmp/t
          run() { docker run --rm -v /tmp/t:/t --entrypoint "$1" xiaoju-hf "${@:2}"; }
          run ffmpeg -nostdin -v error -f lavfi -i testsrc=size=800x600 -frames:v 1 -y /t/a.jpg
          # iPhone 拍的是 HEVC 的 MOV（索引在文件末尾）；镜像里的 ffmpeg 不能编码 HEVC 时退回 MPEG-4
          run ffmpeg -nostdin -v error -f lavfi -i testsrc=size=360x640:rate=30:duration=2 -c:v libx265 -tag:v hvc1 -y /t/v.mov \
            || run ffmpeg -nostdin -v error -f lavfi -i testsrc=size=360x640:rate=30:duration=2 -c:v mpeg4 -y /t/v.mov
          run vips -l | grep -i heifload
          for f in a.jpg sample.heic taken.heic v.mov; do
            run xiaoju thumb "/t/$f" "/t/$f.thumb.jpg" 2>&1 | tee "/tmp/t/$f.log"
            grep -q 'found="\[vips ffmpeg\]"' "/tmp/t/$f.log"
            run vipsheader "/t/$f.thumb.jpg" | tee /dev/stderr | grep -q ': 320x320 '
          done
          # 拍摄时间（相册排序用）从 HEIC 的 EXIF 里读出来了
          grep -q 'taken=2021-02-03T04:05:06' /tmp/t/taken.heic.log
