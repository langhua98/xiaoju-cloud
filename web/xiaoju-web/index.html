<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>小桔</title>
<style>
  :root {
    --bg1: #fdf2f6;
    --bg2: #e9e6fb;
    --panel: rgba(255, 255, 255, 0.82);
    --text: #3a3550;
    --accent: #e98aa8;
    --accent2: #7b6fd6;
    --btn: #ffffff;
    --btn-border: #ebe3f2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: linear-gradient(180deg, var(--bg1), var(--bg2));
  }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; z-index: 10;
    background: linear-gradient(180deg, var(--bg1), var(--bg2));
    transition: opacity .5s;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  .bar { width: 220px; height: 8px; border-radius: 4px; background: #fff; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .2s; }
  #panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 18px 18px 0 0; box-shadow: 0 -4px 20px rgba(120, 100, 160, .12);
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .tabs button {
    flex: 1; border: 0; background: transparent; padding: 6px 0; font-size: 14px;
    color: #8c86a3; border-bottom: 2px solid transparent; font-family: inherit;
  }
  .tabs button.on { color: var(--accent2); border-color: var(--accent2); font-weight: 600; }
  .grid { display: none; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grid.on { display: grid; }
  .grid button {
    border: 1px solid var(--btn-border); background: var(--btn); border-radius: 12px;
    padding: 10px 0 8px; font-size: 13px; color: var(--text); font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .grid button span { font-size: 20px; line-height: 1.2; }
  .grid button:active { transform: scale(.94); background: #fbeef3; }
  .grid button.on { border-color: var(--accent); background: #fdeef3; }
  .credit { grid-column: 1 / -1; font-size: 10px; line-height: 1.5; color: #a29cb8; }
  #tip {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 0; right: 0;
    text-align: center; font-size: 12px; color: #9a94b0; z-index: 4; pointer-events: none;
  }
  #err { color: #c0392b; font-size: 14px; max-width: 280px; text-align: center; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="tip">单指拖动旋转 · 双指缩放</div>

<div id="loading">
  <div style="font-size:18px">小桔正在赶来…</div>
  <div class="bar"><i id="prog"></i></div>
  <div id="pct" style="font-size:13px;color:#9a94b0">0%</div>
  <div id="err"></div>
</div>

<div id="panel">
  <div class="tabs">
    <button class="on" data-tab="act">动作</button>
    <button data-tab="dance">舞蹈</button>
    <button data-tab="face">表情</button>
    <button data-tab="view">视角</button>
  </div>
  <div class="grid on" id="tab-act">
    <button data-act="wave"><span>👋</span>挥手</button>
    <button data-act="nod"><span>🙂</span>点头</button>
    <button data-act="bow"><span>🙇</span>鞠躬</button>
    <button data-act="spin"><span>💫</span>转圈</button>
    <button data-act="jump"><span>⬆️</span>跳一跳</button>
    <button data-act="shake"><span>🙅</span>摇头</button>
    <button data-act="talk"><span>💬</span>说话</button>
    <button data-act="cheer"><span>🙌</span>欢呼</button>
  </div>
  <div class="grid" id="tab-dance">
    <button data-act="dance_loop"><span>🎵</span>小舞步</button>
    <button data-act="charleston"><span>🎷</span>查尔斯顿</button>
    <button data-act="chicken"><span>🐔</span>小鸡舞</button>
    <button data-act="macarena"><span>💃</span>玛卡雷纳</button>
    <button data-act="mickey"><span>🐭</span>米奇舞</button>
    <button data-act="stop"><span>⏹️</span>停下</button>
  </div>
  <div class="grid" id="tab-face">
    <button data-face="neutral" class="on"><span>😐</span>默认</button>
    <button data-face="happy"><span>😊</span>开心</button>
    <button data-face="angry"><span>😠</span>生气</button>
    <button data-face="sad"><span>😢</span>难过</button>
    <button data-face="surprised"><span>😲</span>惊讶</button>
    <button data-face="relaxed"><span>😌</span>放松</button>
    <button data-face="shy"><span>😳</span>害羞</button>
    <button data-face="wink"><span>😉</span>眨眼</button>
  </div>
  <div class="grid" id="tab-view">
    <button data-view="full"><span>🧍</span>全身</button>
    <button data-view="half"><span>👤</span>半身</button>
    <button data-view="face"><span>🔍</span>脸部</button>
    <button data-view="auto"><span>🔄</span>自动转</button>
    <div class="credit">
      动作数据来自开源数据集 open-vrma：Quaternius 动画库（CC0）与 CMU 动作捕捉数据库。
      The data used in this project was obtained from mocap.cs.cmu.edu. The database was created with funding from NSF EIA-0196217.
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.0/lib/three-vrm.module.min.js",
    "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.1.0/lib/three-vrm-animation.module.min.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import {
  VRMLoaderPlugin, VRMUtils,
  VRMSpringBoneCollider, VRMSpringBoneColliderShapeSphere, VRMSpringBoneColliderShapeCapsule,
} from '@pixiv/three-vrm';
import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from '@pixiv/three-vrm-animation';

const MODEL_URL = './xiaoju.vrm';
const MODEL_SIZE = 18537888;

// 动作列表：file 是 motions 文件夹里的 .vrma（真人动作捕捉 / 动画师制作），reps 播放几遍
const MOTIONS = {
  idle:       { file: 'idle' },
  wave:       { file: 'wave', face: 'happy' },
  nod:        { file: 'nod', face: 'happy' },
  shake:      { file: 'shake', face: 'sad' },
  bow:        { file: 'bow', face: 'relaxed' },
  spin:       { file: 'spin', face: 'happy' },
  jump:       { file: 'jump', face: 'surprised' },
  cheer:      { file: 'cheer', face: 'happy' },
  talk:       { file: 'talk', face: 'happy', reps: 2, mouth: 1 },
  dance_loop: { file: 'dance_loop', face: 'happy', reps: 8 },
  charleston: { file: 'charleston', face: 'happy', reps: 2 },
  chicken:    { file: 'chicken', face: 'happy' },
  macarena:   { file: 'macarena', face: 'happy' },
  mickey:     { file: 'mickey', face: 'happy' },
};

// ---------- 场景 ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 50);
camera.position.set(0, 1.2, 4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 0.5;
controls.maxDistance = 8;
controls.target.set(0, 0.9, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(1, 2, 2);
scene.add(sun);

// 地面圆形阴影（跟着腰部移动）
const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(0.45, 48),
  new THREE.MeshBasicMaterial({ color: 0x7b6fd6, transparent: true, opacity: 0.12 })
);
shadow.rotation.x = -Math.PI / 2;
scene.add(shadow);

// 眼睛看向这个点：平时是镜头，偶尔瞟向别处
const lookTarget = new THREE.Object3D();
scene.add(lookTarget);

// ---------- 加载模型 ----------
let vrm = null;
let mixer = null;
let headY = 1.4;
const loader = new GLTFLoader();
loader.register((parser) => new VRMLoaderPlugin(parser));
loader.load(
  MODEL_URL,
  async (gltf) => {
    vrm = gltf.userData.vrm;
    VRMUtils.removeUnnecessaryVertices(gltf.scene);
    if (VRMUtils.combineSkeletons) VRMUtils.combineSkeletons(gltf.scene);
    else if (VRMUtils.removeUnnecessaryJoints) VRMUtils.removeUnnecessaryJoints(gltf.scene);
    VRMUtils.rotateVRM0(vrm); // 兼容旧版 VRM 0.x，1.0 模型不受影响
    vrm.scene.traverse((o) => { o.frustumCulled = false; });
    scene.add(vrm.scene);
    if (vrm.lookAt) vrm.lookAt.target = lookTarget;

    const hp = new THREE.Vector3();
    vrm.humanoid.getNormalizedBoneNode('head').getWorldPosition(hp);
    headY = hp.y;
    setView('full', true);
    prepareFingers();
    measureSkirt();
    addSkirtColliders();

    mixer = new THREE.AnimationMixer(vrm.scene);
    mixer.addEventListener('finished', onFinished);
    try {
      idleAction = mixer.clipAction(await getClip('idle'));
      idleAction.play();
    } catch (e) {
      console.error(e);
    }
    document.getElementById('loading').classList.add('hide');
  },
  (p) => {
    // 服务器压缩传输时 total 可能比实际小，用模型原始大小兜底
    const total = Math.max(p.total || 0, MODEL_SIZE);
    const pct = Math.min(99, Math.round((p.loaded / total) * 100));
    document.getElementById('prog').style.width = pct + '%';
    document.getElementById('pct').textContent = pct + '%';
  },
  (e) => {
    console.error(e);
    document.getElementById('err').textContent = '模型加载失败，请确认 xiaoju.vrm 和网页放在同一个文件夹，并通过网页服务打开。';
  }
);

// ---------- 动作播放 ----------
const motionLoader = new GLTFLoader();
motionLoader.register((parser) => new VRMAnimationLoaderPlugin(parser));
const clips = {};

async function getClip(name) {
  if (clips[name]) return clips[name];
  const gltf = await motionLoader.loadAsync(`./motions/${MOTIONS[name].file}.vrma`);
  const clip = createVRMAnimationClip(gltf.userData.vrmAnimations[0], vrm);
  clip.name = name;
  alignRoot(clip);
  clip.userData = { fingers: clip.tracks.some((t) => /Index|Middle|Thumb/.test(t.name)) };
  clips[name] = clip;
  return clip;
}

// 有的动捕录制时人是侧身或背对的：把动作开头转成面朝镜头，并把起点挪到原地
function alignRoot(clip) {
  const hipsName = vrm.humanoid.getNormalizedBoneNode('hips').name;
  const qt = clip.tracks.find((t) => t.name === hipsName + '.quaternion');
  const pt = clip.tracks.find((t) => t.name === hipsName + '.position');
  if (!qt) return;
  // 每一帧腰部朝向（展开成连续角度，避免 180° 处跳变）
  const q = new THREE.Quaternion();
  const f = new THREE.Vector3();
  const yaws = [];
  for (let i = 0; i < qt.values.length; i += 4) {
    f.set(0, 0, 1).applyQuaternion(q.fromArray(qt.values, i));
    let y = Math.atan2(f.x, f.z);
    if (yaws.length) {
      const prev = yaws[yaws.length - 1];
      while (y - prev > Math.PI) y -= Math.PI * 2;
      while (y - prev < -Math.PI) y += Math.PI * 2;
    }
    yaws.push(y);
  }
  // 原地左右摆的舞：按平均朝向摆正；会转圈的动作：按开头朝向摆正
  const range = Math.max(...yaws) - Math.min(...yaws);
  const yaw = range < Math.PI / 2 ? yaws.reduce((a, b) => a + b, 0) / yaws.length : yaws[0];
  const qc = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -yaw);
  for (let i = 0; i < qt.values.length; i += 4) {
    q.fromArray(qt.values, i).premultiply(qc).toArray(qt.values, i);
  }
  if (pt) {
    const x0 = pt.values[0], z0 = pt.values[2];
    const v = new THREE.Vector3();
    for (let i = 0; i < pt.values.length; i += 3) {
      v.set(pt.values[i] - x0, pt.values[i + 1], pt.values[i + 2] - z0).applyQuaternion(qc).toArray(pt.values, i);
    }
  }
}

let idleAction = null;
let curAction = null;
let curName = null;
let actionFace = null;
const FADE = 0.4;

function fadeTo(next, dur) {
  const prev = curAction || idleAction;
  next.reset();
  next.setEffectiveTimeScale(1);
  next.setEffectiveWeight(1);
  next.fadeIn(dur).play();
  if (prev && prev !== next) prev.fadeOut(dur);
}

async function play(name) {
  if (!vrm || !mixer) return;
  if (name === 'stop') return stop();
  const m = MOTIONS[name];
  if (!m) return;
  let clip;
  try { clip = await getClip(name); } catch (e) { console.error(e); return; }
  const act = mixer.clipAction(clip);
  act.setLoop(THREE.LoopRepeat, m.reps || 1);
  act.clampWhenFinished = true;
  fadeTo(act, FADE);
  curAction = act;
  curName = name;
  actionFace = m.face || null;
  document.querySelectorAll('[data-act]').forEach((b) => b.classList.toggle('on', b.dataset.act === name));
}

function stop() {
  if (!curAction) return;
  fadeTo(idleAction, 0.6);
  curAction = null;
  curName = null;
  actionFace = null;
  document.querySelectorAll('[data-act]').forEach((b) => b.classList.remove('on'));
}

function onFinished(e) {
  if (e.action === curAction) stop();
}

// ---------- 手指 ----------
// 动捕数据（CMU）没有手指动作，这时让手指保持自然微弯，不会直挺挺的
const FINGERS = ['Index', 'Middle', 'Ring', 'Little'];
const fingerRelax = []; // [节点, 目标四元数]
let fingerW = 0;
function prepareFingers() {
  const e = new THREE.Euler();
  for (const side of ['left', 'right']) {
    const s = side === 'left' ? -1 : 1;
    const curl = 0.45;
    FINGERS.forEach((f, i) => {
      const c = curl * (1 + i * 0.12);
      [['Proximal', 0.8], ['Intermediate', 1.0], ['Distal', 0.7]].forEach(([part, k]) => {
        const node = vrm.humanoid.getNormalizedBoneNode(side + f + part);
        if (node) fingerRelax.push([node, new THREE.Quaternion().setFromEuler(e.set(0, 0, s * c * k))]);
      });
    });
    [['ThumbProximal', 0.35], ['ThumbDistal', 0.4]].forEach(([part, k]) => {
      const node = vrm.humanoid.getNormalizedBoneNode(side + part);
      if (node) fingerRelax.push([node, new THREE.Quaternion().setFromEuler(e.set(0, -s * curl * k, 0))]);
    });
  }
}
function relaxFingers(dt) {
  const want = curAction && !curAction.getClip().userData.fingers ? 1 : 0;
  fingerW += (want - fingerW) * Math.min(1, dt * 5);
  if (fingerW < 0.01) return;
  for (const [node, q] of fingerRelax) node.quaternion.slerp(q, fingerW);
}

// ---------- 防止手和裙子穿模 ----------
// 动捕演员穿的是紧身衣，手垂下来离身体很近；小桔的裙子是外扩的 A 字裙，手就会插进裙子里。
// 做法一：加载时从模型量出裙子在每个高度的宽度；每一帧检查前臂和手，如果进了裙子，就把整条手臂往外转一点。
// 做法二：把前臂和手加进裙摆的物理碰撞，裙摆被手碰到时会被推开。
const skirt = { prof: null };
const SKIRT_MARGIN = 0.04; // 手和前臂的粗细，留出的余量（米）

function measureSkirt() {
  vrm.scene.updateMatrixWorld(true);
  const hp = vrm.humanoid.getNormalizedBoneNode('hips').getWorldPosition(new THREE.Vector3());
  const bands = new Map();
  const p = new THREE.Vector3();
  vrm.scene.traverse((o) => {
    if (!o.isSkinnedMesh) return;
    const mats = [].concat(o.material);
    if (!mats.some((m) => /Tops|Onepiece|Bottoms|Skirt/i.test(m.name))) return;
    const n = o.geometry.attributes.position.count;
    for (let i = 0; i < n; i++) {
      o.getVertexPosition(i, p);
      p.applyMatrix4(o.matrixWorld);
      const dy = p.y - hp.y;
      if (dy < -0.6 || dy > 0.22) continue; // 只看腰上一点到裙摆（避开 T 字姿势时的手臂）
      const k = Math.round(dy / 0.04);
      const b = bands.get(k) || { rx: 0, zf: 0, zb: 0 };
      b.rx = Math.max(b.rx, Math.abs(p.x - hp.x));
      b.zf = Math.max(b.zf, p.z - hp.z);
      b.zb = Math.max(b.zb, hp.z - p.z);
      bands.set(k, b);
    }
  });
  if (!bands.size) return;
  skirt.prof = [...bands.entries()].sort((a, b) => a[0] - b[0]).map(([k, b]) => ({
    dy: k * 0.04,
    rx: b.rx,
    zf: Math.max(b.zf, b.rx * 0.6),
    zb: Math.max(b.zb, b.rx * 0.6),
  }));
}

// 给定高度（相对腰部），返回裙子在这个高度的半宽/前/后
function skirtAt(dy) {
  const pr = skirt.prof;
  if (dy < pr[0].dy - 0.03 || dy > pr[pr.length - 1].dy) return null;
  if (dy <= pr[0].dy) return pr[0];
  for (let i = 1; i < pr.length; i++) {
    if (dy <= pr[i].dy) {
      const a = pr[i - 1], b = pr[i], t = (dy - a.dy) / (b.dy - a.dy);
      return { rx: a.rx + (b.rx - a.rx) * t, zf: a.zf + (b.zf - a.zf) * t, zb: a.zb + (b.zb - a.zb) * t };
    }
  }
  return pr[pr.length - 1];
}

const _hipsInv = new THREE.Matrix4();
const _pts = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
const _sh = new THREE.Vector3(), _l = new THREE.Vector3(), _dir = new THREE.Vector3(), _a = new THREE.Vector3(), _axis = new THREE.Vector3();
const _pq = new THREE.Quaternion(), _dq = new THREE.Quaternion();

function avoidSkirt() {
  if (!skirt.prof) return;
  const nb = (n) => vrm.humanoid.getNormalizedBoneNode(n);
  const hips = nb('hips');
  vrm.scene.updateMatrixWorld(true);
  _hipsInv.copy(hips.matrixWorld).invert();
  for (const side of ['left', 'right']) {
    const ua = nb(side + 'UpperArm'), la = nb(side + 'LowerArm'), hd = nb(side + 'Hand');
    if (!ua || !la || !hd) continue;
    for (let iter = 0; iter < 4; iter++) {
      ua.getWorldPosition(_sh);
      la.getWorldPosition(_pts[0]);                                   // 手肘
      hd.getWorldPosition(_pts[2]);                                   // 手腕
      _pts[1].lerpVectors(_pts[0], _pts[2], 0.5);                     // 前臂中间
      _pts[3].copy(_pts[2]).sub(_pts[0]).multiplyScalar(0.45).add(_pts[2]); // 指尖附近
      let best = 0, bestI = -1;
      const bestDir = new THREE.Vector3();
      for (let i = 0; i < 4; i++) {
        _l.copy(_pts[i]).applyMatrix4(_hipsInv);
        const s = skirtAt(_l.y);
        if (!s) continue;
        const d = Math.hypot(_l.x, _l.z);
        const c = d > 1e-4 ? _l.x / d : (side === 'left' ? 1 : -1);
        const sn = d > 1e-4 ? _l.z / d : 0;
        const rz = _l.z >= 0 ? s.zf : s.zb;
        const r = 1 / Math.sqrt((c / s.rx) ** 2 + (sn / rz) ** 2);
        const pen = r + SKIRT_MARGIN - d;
        if (pen > best) {
          best = pen;
          bestI = i;
          bestDir.set(c, 0, sn);
        }
      }
      if (bestI < 0 || best < 0.002) break;
      // 把手臂绕肩膀往裙子外侧转，刚好让这一点出来
      _dir.copy(bestDir).transformDirection(hips.matrixWorld);
      _a.copy(_pts[bestI]).sub(_sh);
      _axis.copy(_a).cross(_dir);
      if (_axis.lengthSq() < 1e-8) break;
      _axis.normalize();
      _dq.setFromAxisAngle(_axis, Math.atan2(best, _a.length()) * 1.05);
      ua.parent.getWorldQuaternion(_pq);
      ua.quaternion.premultiply(_pq.clone().invert().multiply(_dq).multiply(_pq));
      ua.updateMatrixWorld(true);
    }
  }
}

function addSkirtColliders() {
  const sm = vrm.springBoneManager;
  if (!sm) return;
  const groups = [];
  for (const side of ['left', 'right']) {
    const la = vrm.humanoid.getRawBoneNode(side + 'LowerArm');
    const hd = vrm.humanoid.getRawBoneNode(side + 'Hand');
    const mid = vrm.humanoid.getRawBoneNode(side + 'MiddleProximal');
    if (!la || !hd) continue;
    const colliders = [];
    // 前臂：胶囊体，从手肘到手腕
    const c1 = new VRMSpringBoneCollider(new VRMSpringBoneColliderShapeCapsule({
      offset: new THREE.Vector3(), tail: hd.position.clone(), radius: 0.035,
    }));
    la.add(c1);
    colliders.push(c1);
    // 手掌：胶囊体，从手腕到手指
    const tip = mid ? mid.position.clone().multiplyScalar(1.8) : new THREE.Vector3((side === 'left' ? 1 : -1) * 0.08, 0, 0);
    const c2 = new VRMSpringBoneCollider(new VRMSpringBoneColliderShapeCapsule({
      offset: new THREE.Vector3(), tail: tip, radius: 0.04,
    }));
    hd.add(c2);
    colliders.push(c2);
    groups.push({ name: 'skirtGuard_' + side, colliders });
  }
  for (const j of sm.joints) {
    if (/Skirt/i.test(j.bone.name)) j.colliderGroups = [...j.colliderGroups, ...groups];
  }
}

// ---------- 头部跟随镜头、害羞歪头 ----------
// 叠加在动作之上：待机时头会稍微转向你；动作进行时自动减弱，不干扰动作本身
let followW = 1, shyW = 0;
const tmpQ = new THREE.Quaternion(), tmpE = new THREE.Euler();
function headExtras(dt) {
  followW += ((curAction ? 0.15 : 1) - followW) * Math.min(1, dt * 3);
  shyW += ((faceSel === 'shy' ? 1 : 0) - shyW) * Math.min(1, dt * 3);
  const p = vrm.scene.worldToLocal(camera.position.clone());
  let yaw = Math.atan2(p.x, p.z);
  const behind = Math.min(1, Math.max(0, (Math.abs(yaw) - 1.2) / 0.6));
  yaw = Math.max(-0.7, Math.min(0.7, yaw));
  const pitch = Math.max(-0.35, Math.min(0.35, -Math.atan2(p.y - headY, Math.hypot(p.x, p.z))));
  const w = followW * (1 - behind);
  const apply = (bone, k, extra) => {
    const node = vrm.humanoid.getNormalizedBoneNode(bone);
    if (!node) return;
    tmpE.set(pitch * k * w + extra[0], yaw * k * w + extra[1], extra[2]);
    node.quaternion.multiply(tmpQ.setFromEuler(tmpE));
  };
  apply('neck', 0.3, [0.08 * shyW, 0, 0]);
  apply('head', 0.35, [0.2 * shyW, -0.25 * shyW, 0.15 * shyW]);
}

// ---------- 视线 ----------
const glance = { next: 3, active: false, off: new THREE.Vector2(), cur: new THREE.Vector2() };
function updateGaze(dt) {
  glance.next -= dt;
  if (glance.next <= 0) {
    if (glance.active) {
      glance.off.set(0, 0);
      glance.next = 2 + Math.random() * 4;
    } else {
      glance.off.set((Math.random() - 0.5) * 0.9, (Math.random() - 0.5) * 0.4);
      glance.next = 0.4 + Math.random() * 0.8;
      if (Math.random() < 0.5) blinkT = 0; // 移开视线时常顺便眨眼
    }
    glance.active = !glance.active;
  }
  const off = faceSel === 'shy' ? new THREE.Vector2(0.6, -0.5) : glance.off;
  glance.cur.lerp(off, Math.min(1, dt * 14));
  const dist = camera.position.distanceTo(controls.target);
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
  const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
  lookTarget.position.copy(camera.position)
    .addScaledVector(right, glance.cur.x * dist * 0.5)
    .addScaledVector(up, glance.cur.y * dist * 0.5);
}

// ---------- 表情 ----------
const FACES = ['happy', 'angry', 'sad', 'surprised', 'relaxed'];
let faceSel = 'neutral';
const faceW = Object.fromEntries(FACES.map((k) => [k, 0]));
let blinkTimer = 2, blinkT = -1, winkT = -1;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const wave3 = (t, s) => Math.sin(t + s) * 0.5 + Math.sin(t * 2.13 + s * 1.7) * 0.3 + Math.sin(t * 3.71 + s * 2.9) * 0.2;

function setFace(name) {
  faceSel = name;
  document.querySelectorAll('[data-face]').forEach((b) => b.classList.toggle('on', b.dataset.face === name));
  if (name === 'wink') winkT = 0;
}

let talkT = 0;
function updateFace(dt, time) {
  const em = vrm.expressionManager;
  if (!em) return;
  const sel = faceSel === 'shy' ? 'relaxed' : faceSel === 'wink' ? 'happy' : faceSel;
  const want = curAction && actionFace && faceSel === 'neutral' ? actionFace : sel;
  for (const k of FACES) {
    const target = k === want ? (faceSel === 'wink' ? 0.5 : 1) : 0;
    faceW[k] += (target - faceW[k]) * Math.min(1, dt * 6);
  }
  // 自动眨眼：闭眼快、睁眼慢；偶尔连眨两下
  blinkTimer -= dt;
  if (blinkTimer <= 0 && blinkT < 0) {
    blinkT = 0;
    blinkTimer = Math.random() < 0.2 ? 0.25 : 2 + Math.random() * 3.5;
  }
  let blink = 0;
  if (blinkT >= 0) {
    blinkT += dt;
    blink = blinkT < 0.07 ? blinkT / 0.07 : 1 - clamp01((blinkT - 0.07) / 0.13);
    if (blinkT > 0.2) blinkT = -1;
  }
  let wink = 0;
  if (winkT >= 0) {
    winkT += dt;
    wink = winkT < 0.1 ? winkT / 0.1 : winkT < 0.5 ? 1 : 1 - clamp01((winkT - 0.5) / 0.2);
    if (winkT > 0.8) { winkT = -1; setFace('neutral'); }
  }
  // 说话口型
  const talking = curName && MOTIONS[curName].mouth;
  talkT += ((talking ? 1 : 0) - talkT) * Math.min(1, dt * 8);
  const aa = clamp01(wave3(time * 9, 1) * 0.9 + 0.3) * 0.75 * talkT;
  const oh = clamp01(wave3(time * 7, 4) * 0.8) * 0.45 * talkT;
  const ih = clamp01(wave3(time * 8, 8) * 0.8) * 0.3 * talkT;

  for (const k of FACES) em.setValue(k, faceW[k]);
  em.setValue('blink', clamp01(blink * (1 - faceW.happy - faceW.relaxed)));
  em.setValue('blinkLeft', wink);
  em.setValue('aa', aa);
  em.setValue('oh', oh);
  em.setValue('ih', ih);
}

// ---------- 视角 ----------
let autoRotate = false;
const viewAnim = { from: null, to: null, t: 1 };
function setView(name, instant = false) {
  if (name === 'auto') {
    autoRotate = !autoRotate;
    controls.autoRotate = autoRotate;
    controls.autoRotateSpeed = 2;
    document.querySelector('[data-view="auto"]').classList.toggle('on', autoRotate);
    return;
  }
  const h = headY + 0.1;
  const presets = {
    full: { target: [0, h * 0.45, 0], dist: h * 3.7 },
    half: { target: [0, h * 0.68, 0], dist: h * 1.6 },
    face: { target: [0, headY - 0.06, 0], dist: 0.9 },
  };
  const p = presets[name];
  if (!p) return;
  const dir = camera.position.clone().sub(controls.target).normalize();
  const target = new THREE.Vector3(...p.target);
  const pos = target.clone().add(dir.multiplyScalar(p.dist));
  if (instant) {
    controls.target.copy(target);
    camera.position.copy(pos);
    return;
  }
  viewAnim.from = { t: controls.target.clone(), p: camera.position.clone() };
  viewAnim.to = { t: target, p: pos };
  viewAnim.t = 0;
}

// ---------- 每帧更新 ----------
const clock = new THREE.Clock();
const hipsPos = new THREE.Vector3();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  if (viewAnim.t < 1) {
    viewAnim.t = Math.min(1, viewAnim.t + dt * 2.5);
    const k = viewAnim.t * viewAnim.t * (3 - 2 * viewAnim.t);
    controls.target.lerpVectors(viewAnim.from.t, viewAnim.to.t, k);
    camera.position.lerpVectors(viewAnim.from.p, viewAnim.to.p, k);
  }
  controls.update();

  if (vrm) {
    if (mixer) mixer.update(dt);   // 播放动作捕捉数据
    relaxFingers(dt);
    headExtras(dt);
    avoidSkirt();                  // 手臂绕开裙子，防止穿模
    updateGaze(dt);
    updateFace(dt, time);
    vrm.update(dt);                // 头发裙子物理、表情、视线
    vrm.humanoid.getRawBoneNode('hips').getWorldPosition(hipsPos);
    shadow.position.set(hipsPos.x, 0.001, hipsPos.z);
  }
  renderer.render(scene, camera);
}
animate();

// ---------- 按钮 ----------
document.querySelectorAll('.tabs button').forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b === btn));
    document.querySelectorAll('.grid').forEach((g) => g.classList.toggle('on', g.id === 'tab-' + btn.dataset.tab));
  };
});
document.querySelectorAll('[data-act]').forEach((b) => (b.onclick = () => play(b.dataset.act)));
document.querySelectorAll('[data-face]').forEach((b) => (b.onclick = () => setFace(b.dataset.face)));
document.querySelectorAll('[data-view]').forEach((b) => (b.onclick = () => setView(b.dataset.view)));

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- 给代码调用的接口 ----------
// 在浏览器控制台里可以直接写：xiaoju.play('charleston')、xiaoju.stop()、xiaoju.face('happy')、xiaoju.turn(90)
window.xiaoju = {
  play,
  stop,
  face: setFace,
  view: setView,
  turn: (deg) => {
    controls.autoRotate = false;
    const off = camera.position.clone().sub(controls.target)
      .applyAxisAngle(new THREE.Vector3(0, 1, 0), THREE.MathUtils.degToRad(deg));
    camera.position.copy(controls.target).add(off);
  },
  get vrm() { return vrm; },
  get mixer() { return mixer; },
  actions: Object.keys(MOTIONS).filter((k) => k !== 'idle'),
};
</script>
</body>
</html>
