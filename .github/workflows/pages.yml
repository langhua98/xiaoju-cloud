name: Deploy web to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write config.js
        # 仓库变量 XIAOJU_API_URL（如 https://user-xiaoju-cloud.hf.space）覆盖前端默认服务端地址
        if: ${{ vars.XIAOJU_API_URL != '' }}
        env:
          XIAOJU_API_URL: ${{ vars.XIAOJU_API_URL }}
        run: |
          printf 'window.XIAOJU_API_URL = %s;\n' "$(jq -Rn --arg v "$XIAOJU_API_URL" '$v')" > web/config.js
          cat web/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
